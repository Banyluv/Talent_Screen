# Run before each release: kubectl -n talentscreen delete job talentscreen-migrate --ignore-not-found && kubectl apply -f 10-migrate-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: talentscreen-migrate
  namespace: talentscreen
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: migrate
          image: ghcr.io/ecews/talentscreen-api:1.0.0
          command: ["node", "dist/migrate.js"]
          envFrom: [{ configMapRef: { name: talentscreen-config } }, { secretRef: { name: talentscreen-secrets } }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
