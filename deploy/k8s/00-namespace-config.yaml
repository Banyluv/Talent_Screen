# ECEWS TalentScreen on Kubernetes (AKS or any CNCF cluster).
# Data services are external and managed:
#   PostgreSQL 16  → Azure Database for PostgreSQL Flexible Server (allow-list extensions pgcrypto, pg_trgm)
#   CV files       → Azure Blob Storage (STORAGE_DRIVER=azure) or any S3-compatible store
#   Secrets        → Azure Key Vault via the Secrets Store CSI driver, or create the Secret below
apiVersion: v1
kind: Namespace
metadata:
  name: talentscreen
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: talentscreen-config
  namespace: talentscreen
data:
  NODE_ENV: production
  PUBLIC_URL: https://talentscreen.ecews.org
  FRONTEND_URL: https://talentscreen.ecews.org
  CORS_ORIGINS: https://talentscreen.ecews.org
  # Same origin via the web app's /api proxy, so "lax" is correct.
  COOKIE_SAMESITE: lax
  API_PORT: "8000"
  DATABASE_SSL: "true"
  STORAGE_DRIVER: azure
  AZURE_STORAGE_CONTAINER: talentscreen-cvs
  LOCAL_LOGIN_ENABLED: "false"
  OIDC_ENABLED: "true"
  OIDC_DISPLAY_NAME: Microsoft Entra ID
  OIDC_REDIRECT_URI: https://talentscreen.ecews.org/api/auth/oidc/callback
  OIDC_DEFAULT_ROLE: viewer
  OIDC_AUTO_PROVISION: "true"
  AZURE_OPENAI_API_VERSION: "2024-10-21"
  WORKER_CONCURRENCY: "2"
  SEED_DEMO_DATA: "false"
---
# Template only. Prefer Key Vault + CSI driver; never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: talentscreen-secrets
  namespace: talentscreen
type: Opaque
stringData:
  DATABASE_URL: postgres://talentscreen:CHANGE_ME@<server>.postgres.database.azure.com:5432/talentscreen
  JWT_SECRET: CHANGE_ME_openssl_rand_base64_48
  DATA_ENCRYPTION_KEY: CHANGE_ME_openssl_rand_base64_32
  AZURE_STORAGE_CONNECTION_STRING: CHANGE_ME
  OIDC_ISSUER: https://login.microsoftonline.com/<tenant-id>/v2.0
  OIDC_CLIENT_ID: CHANGE_ME
  OIDC_CLIENT_SECRET: CHANGE_ME
  AZURE_OPENAI_ENDPOINT: https://<resource>.openai.azure.com
  AZURE_OPENAI_API_KEY: CHANGE_ME
  AZURE_OPENAI_DEPLOYMENT: gpt-4o-mini
  BOOTSTRAP_ADMIN_EMAIL: o.agunloye@ecews.org
  BOOTSTRAP_ADMIN_NAME: System Administrator
