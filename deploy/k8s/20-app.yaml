apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: talentscreen, labels: { app: api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: api
          image: ghcr.io/ecews/talentscreen-api:1.0.0
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: talentscreen-config } }, { secretRef: { name: talentscreen-secrets } }]
          readinessProbe: { httpGet: { path: /api/health, port: 8000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: 8000 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: talentscreen, labels: { app: worker } }
spec:
  replicas: 2
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: worker
          image: ghcr.io/ecews/talentscreen-api:1.0.0
          command: ["python", "-m", "app.worker"]
          envFrom: [{ configMapRef: { name: talentscreen-config } }, { secretRef: { name: talentscreen-secrets } }]
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1536Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: talentscreen, labels: { app: web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 101 }
      containers:
        - name: web
          image: ghcr.io/ecews/talentscreen-web:1.0.0
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: talentscreen }   # name must be "api": nginx proxies to http://api:8000
spec: { selector: { app: api }, ports: [{ port: 8000, targetPort: 8000 }] }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: talentscreen }
spec: { selector: { app: web }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: talentscreen
  namespace: talentscreen
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 60m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
spec:
  ingressClassName: nginx
  tls: [{ hosts: [talentscreen.ecews.org], secretName: talentscreen-tls }]
  rules:
    - host: talentscreen.ecews.org
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: worker, namespace: talentscreen }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker }
  minReplicas: 1
  maxReplicas: 6
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-ingress-from-web, namespace: talentscreen }
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: { matchLabels: { app: web } } }], ports: [{ port: 8000 }] }]
