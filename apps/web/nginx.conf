# Serves the React app and proxies /api to the API service.
# "api" resolves through Docker DNS (Compose service) or a Kubernetes Service of the same name.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    client_max_body_size 60m;          # bulk CV uploads (MAX_UPLOAD_MB x files)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # nginx drops server-level add_header in any location that sets its own, so the headers live in a snippet
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;       # large bulk uploads are parsed before the response
        proxy_request_buffering off;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
